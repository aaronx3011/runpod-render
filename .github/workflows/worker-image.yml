# Builds worker/Dockerfile on the self-hosted build machine and pushes it to GHCR, tagged by
# git SHA only (never `latest`).
#
# SECURITY: this repository is public. Never add `pull_request` or `pull_request_target` here,
# or fork code could run on the self-hosted runner. The runner also enforces this itself
# (scripts/runner/job-guard.sh).
name: worker-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One build at a time. A running build finishes; only the newest waiting one is kept.
concurrency:
  group: worker-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aaronx3011/runpod-render-worker
  BUILDER: runpod-render # also known to scripts/runner/prune.sh
  MIN_FREE_GB: "50"
  MAX_JOBS: "3" # parallel compile jobs; sized for a 15 GB RAM machine shared with other work

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, lesbian]
    timeout-minutes: 360
    steps:
      - name: Fail fast if disk is low
        run: |
          set -euo pipefail
          for dir in "$(docker info --format '{{.DockerRootDir}}')" "$HOME"; do
            free=$(df -P -B1 "$dir" | awk 'NR==2 {print $4}')
            echo "free for $dir: $((free / 1000000000)) GB"
            if [ "$free" -lt $((MIN_FREE_GB * 1000000000)) ]; then
              echo "::error::less than ${MIN_FREE_GB} GB free for $dir"
              exit 1
            fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f worker/Dockerfile || { echo "::error::worker/Dockerfile is missing"; exit 1; }

          # Registry credentials stay in a per-job directory, not in the machine user's ~/.docker.
          export BUILDX_CONFIG="$HOME/.docker/buildx"
          export DOCKER_CONFIG="${RUNNER_TEMP:?}/docker-config"
          root="${HOME:?}/.cache/runpod-render"
          cache="$root/buildx"
          mkdir -p "$root"

          # Shared with prune.sh so it never prunes under a running build.
          exec 9>"$root/lock"
          flock 9

          cleanup() {
            docker buildx rm "$BUILDER" >/dev/null 2>&1 || true
            rm -rf "${DOCKER_CONFIG:?}" "${cache:?}.new"
          }
          trap cleanup EXIT
          cleanup
          mkdir -p "$DOCKER_CONFIG"

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          # A throwaway builder with a memory cap; layers persist only in the local cache directory.
          docker buildx create --name "$BUILDER" --driver docker-container \
            --driver-opt memory=9g --driver-opt memory-swap=13g

          cache_from=()
          if [ -f "$cache/index.json" ]; then
            cache_from=(--cache-from "type=local,src=$cache")
          fi

          docker buildx build \
            --builder "$BUILDER" \
            --platform linux/amd64 \
            --file worker/Dockerfile \
            --build-arg "IMAGE_TAG=$GITHUB_SHA" \
            --build-arg "MAX_JOBS=$MAX_JOBS" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" \
            "${cache_from[@]}" \
            --cache-to "type=local,dest=$cache.new,mode=max" \
            --push \
            .

          # Replace rather than append, so the local cache does not grow without bound.
          rm -rf "${cache:?}"
          mv "$cache.new" "$cache"
          echo "published \`$IMAGE:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
